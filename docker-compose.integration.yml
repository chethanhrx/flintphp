services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: testroot
      MYSQL_DATABASE: flintphp_test
      MYSQL_USER: flintphp
      MYSQL_PASSWORD: flintphp_test
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ptestroot"]
      interval: 5s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: flintphp_test
      POSTGRES_USER: flintphp
      POSTGRES_PASSWORD: flintphp_test
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flintphp -d flintphp_test"]
      interval: 5s
      timeout: 5s
      retries: 30
